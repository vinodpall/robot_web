version: '3.8'

services:
  robot-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILD_ENV=${BUILD_ENV:-internet}
    image: robot-web:latest
    container_name: robot-web
    restart: always
    network_mode: "host"
    ports:
      - "${HOST_PORT:-5173}:4173"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=4173
      - BACKEND_URL=${BACKEND_URL:-http://host.docker.internal:18000}
      - NODE_ENV=production
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
